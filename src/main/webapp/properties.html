<body>

    <header>
        <h2>Real Estate Management System</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="properties.html">Properties</a>
            <a href="agents.html">Agents</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="properties">

            <h1>Available Properties</h1>

            <p class="intro">
                Explore available properties and find the perfect
                place for your home or business.
            </p>

            <div class="property-list" id="propertyList">
                <p class="message">Loading properties...</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Real Estate Management System &copy; 2026</p>
    </footer>

    <script>
        async function loadProperties() {
            const propertyList =
                document.getElementById("propertyList");

            try {
                const response = await fetch("api/properties");

                if (!response.ok) {
                    throw new Error(
                        "API request failed: " + response.status
                    );
                }

                const data = await response.json();

                // The API may return an array or an object
                // containing a properties array.
                const properties = Array.isArray(data)
                    ? data
                    : data.properties;

                if (!Array.isArray(properties)) {
                    throw new Error(
                        "Unexpected properties data format"
                    );
                }

                propertyList.replaceChildren();

                if (properties.length === 0) {
                    const message = document.createElement("p");
                    message.className = "message";
                    message.textContent =
                        "No properties are available right now.";

                    propertyList.appendChild(message);
                    return;
                }

                properties.forEach(function(property) {
                    const card = document.createElement("article");
                    card.className = "property-card";

                    // Property title
                    const title = document.createElement("h3");
                    title.textContent =
                        property.title || "Property Listing";

                    card.appendChild(title);

                    // Property price
                    const price = document.createElement("div");
                    price.className = "property-price";

                    const numericPrice = Number(property.price);

                    price.textContent =
                        property.price !== null &&
                        property.price !== undefined &&
                        property.price !== "" &&
                        Number.isFinite(numericPrice)
                            ? numericPrice.toLocaleString("en-IN", {
                                style: "currency",
                                currency: "INR",
                                maximumFractionDigits: 0
                            })
                            : "Price on request";

                    card.appendChild(price);

                    // Add property details safely
                    function addDetail(label, value) {
                        const paragraph =
                            document.createElement("p");

                        const strong =
                            document.createElement("strong");

                        strong.textContent = label + ": ";

                        paragraph.appendChild(strong);

                        paragraph.appendChild(
                            document.createTextNode(
                                value === null ||
                                value === undefined ||
                                value === ""
                                    ? "N/A"
                                    : String(value)
                            )
                        );

                        card.appendChild(paragraph);
                    }

                    addDetail("Location", property.location);
                    addDetail("Type", property.property_type);
                    addDetail("Bedrooms", property.bedrooms);
                    addDetail("Bathrooms", property.bathrooms);

                    addDetail(
                        "Area",
                        property.area_sqft !== null &&
                        property.area_sqft !== undefined
                            ? property.area_sqft + " sq. ft."
                            : "N/A"
                    );

                    // Availability status
                    const statusParagraph =
                        document.createElement("p");

                    const statusBadge =
                        document.createElement("span");

                    statusBadge.className = "property-status";
                    statusBadge.textContent =
                        property.status || "Status unknown";

                    statusParagraph.appendChild(statusBadge);
                    card.appendChild(statusParagraph);

                    propertyList.appendChild(card);
                });

            } catch (error) {
                console.error(
                    "Unable to load properties:",
                    error
                );

                propertyList.replaceChildren();

                const message = document.createElement("p");
                message.className = "message";
                message.textContent =
                    "Properties could not be loaded. " +
                    "Please check the server and try again.";

                propertyList.appendChild(message);
            }
        }

        loadProperties();
    </script>

</body>
</html>
